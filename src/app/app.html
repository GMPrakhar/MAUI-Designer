<div class="maui-designer">
  <div class="header">
    <h1>{{ title() }}</h1>

    <div class="header-actions">
      <button
        class="header-button"
        data-testid="undo-button"
        [disabled]="!canUndo"
        title="Undo (Ctrl+Z)"
        (click)="undo()">
        <span class="material-icons">undo</span>
        Undo
      </button>

      <button
        class="header-button"
        data-testid="redo-button"
        [disabled]="!canRedo"
        title="Redo (Ctrl+Y)"
        (click)="redo()">
        <span class="material-icons">redo</span>
        Redo
      </button>

      <button
        class="header-button"
        data-testid="save-button"
        title="Save design in this browser"
        (click)="saveDesign()">
        <span class="material-icons">save</span>
        Save
      </button>

      <button
        class="header-button"
        data-testid="load-button"
        title="Load the saved design"
        (click)="loadDesign()">
        <span class="material-icons">folder_open</span>
        Load
      </button>

      <button
        class="header-button"
        data-testid="clear-button"
        title="Remove every element from the canvas"
        (click)="clearDesign()">
        <span class="material-icons">delete_sweep</span>
        Clear
      </button>
    </div>
  </div>

  <div class="toast" data-testid="app-toast" *ngIf="toastMessage">{{ toastMessage }}</div>
  
  <div class="designer-container">
    <!-- Left Panel -->
    <div class="left-panel" [style.width.px]="leftPanelWidth">
      <div class="panel-tabs">
        <button 
          class="tab-button" 
          [class.active]="selectedTab === 'toolbox'"
          data-testid="tab-toolbox"
          (click)="selectTab('toolbox')">
          Toolbox
        </button>
        <button 
          class="tab-button" 
          [class.active]="selectedTab === 'hierarchy'"
          data-testid="tab-hierarchy"
          (click)="selectTab('hierarchy')">
          Hierarchy
        </button>
      </div>
      
      <div class="panel-content">
        <app-toolbox *ngIf="selectedTab === 'toolbox'"></app-toolbox>
        <app-hierarchy-panel *ngIf="selectedTab === 'hierarchy'"></app-hierarchy-panel>
      </div>
    </div>
    
    <!-- Left Resize Handle -->
    <div class="resize-handle horizontal" 
         (mousedown)="onResizeStart($event, 'left')"></div>
    
    <!-- Center Canvas -->
    <div class="center-panel">
      <app-canvas-toolbar></app-canvas-toolbar>
      <app-designer-canvas></app-designer-canvas>
    </div>
    
    <!-- Right Resize Handle -->
    <div class="resize-handle horizontal" 
         (mousedown)="onResizeStart($event, 'right')"></div>
    
    <!-- Right Panel -->
    <div class="right-panel" [style.width.px]="rightPanelWidth">
      <div class="panel-tabs">
        <button class="tab-button active">Properties</button>
      </div>
      
      <div class="panel-content">
        <app-properties-panel></app-properties-panel>
      </div>
    </div>
  </div>
  
  <!-- Bottom Resize Handle -->
  <div class="resize-handle vertical" 
       (mousedown)="onResizeStart($event, 'bottom')"></div>
  
  <!-- Bottom Panel -->
  <div class="bottom-panel" [style.height.px]="bottomPanelHeight">
    <div class="panel-tabs">
      <button 
        class="tab-button" 
        [class.active]="selectedBottomTab === 'xaml'"
        (click)="selectBottomTab('xaml')">
        XAML
      </button>
    </div>
    
    <div class="panel-content">
      <app-xaml-editor *ngIf="selectedBottomTab === 'xaml'"></app-xaml-editor>
    </div>
  </div>
</div>
