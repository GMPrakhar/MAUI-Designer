name: Package VSIX

# Packaging a VSIX needs the VSSDK build targets, which only run on Windows.
# Everything else about the extension is verified on Linux by ci.yml.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a pre-release under this tag (leave empty to only produce a build artifact)'
        required: false
        default: ''
  push:
    tags:
      - 'vsix-v*'
  pull_request:
    paths:
      - 'extension/**'
      - '.github/workflows/release-vsix.yml'

permissions:
  contents: write

jobs:
  package:
    name: Build the extension installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      # The VSIX embeds the compiled Angular app and serves it through a
      # WebView2 virtual host, so the web build has to happen first.
      - name: Build the designer web app
        run: npm run build

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild extension\src\MauiDesigner.Vsix\MauiDesigner.Vsix.csproj -t:Restore -p:Configuration=Release

      - name: Build the VSIX
        run: msbuild extension\src\MauiDesigner.Vsix\MauiDesigner.Vsix.csproj -p:Configuration=Release -p:DeployExtension=false -p:IsBuildingVsix=true

      - name: Check the package really contains the web assets
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path extension\src\MauiDesigner.Vsix\bin\Release -Filter *.vsix -Recurse |
                  Select-Object -First 1
          if (-not $vsix) { throw 'No .vsix was produced.' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
          } finally {
            $zip.Dispose()
          }

          # A VSIX that installs but shows an empty WebView is the failure mode
          # worth guarding against, so assert on the payload, not just the file.
          foreach ($required in @('extension.vsixmanifest', 'MauiDesigner.Vsix.dll', 'MauiDesigner.Core.dll')) {
            if ($names -notcontains $required) { throw "The VSIX is missing $required." }
          }
          if (-not ($names -match '^webview/index\.html$')) {
            throw 'The VSIX does not contain webview/index.html.'
          }

          Write-Host "$($vsix.Name) contains $($names.Count) entries."
          Copy-Item $vsix.FullName MauiDesigner.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: MauiDesigner-vsix
          path: MauiDesigner.vsix
          if-no-files-found: error

  install-check:
    name: Install into ${{ matrix.label }}
    needs: package
    # The Windows runner images ship a real Visual Studio with the extension
    # development workload, so the VSIX can be installed into an actual IDE
    # rather than merely inspected. Both generations the manifest claims to
    # support are exercised, because a version range is only a promise until
    # something installs against it -- ours excluded Visual Studio 2026
    # entirely until this job pointed it out.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Visual Studio 2022
          - runner: windows-latest
            label: Visual Studio 2026
    runs-on: ${{ matrix.runner }}

    env:
      # Must match Metadata/Identity/@Id in source.extension.vsixmanifest
      EXTENSION_IDENTITY: MauiDesigner.6e7b4b0d-8f5a-4a63-9f1e-4f2f7b0c6a11
      EDITOR_FACTORY_GUID: '{c1e5aa5a-2f4f-4c92-9b1c-8f5a55da0e77}'
      PACKAGE_GUID: '{3b9a7bd5-51b1-4f2a-9a1d-0f0a4a2f9c31}'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MauiDesigner-vsix

      - name: Install the extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -format json | ConvertFrom-Json | Select-Object -First 1
          if (-not $vs) { throw 'No Visual Studio installation was found on the runner.' }

          Write-Host "Installing into $($vs.displayName) $($vs.installationVersion) at $($vs.installationPath)"
          "VS_PATH=$($vs.installationPath)" | Out-File $env:GITHUB_ENV -Append
          # The per-user extension folder is named for the instance, so resolving
          # it this way keeps working when Visual Studio changes major version.
          "VS_INSTANCE=$($vs.instanceId)" | Out-File $env:GITHUB_ENV -Append

          $vsixInstaller = Join-Path $vs.installationPath 'Common7\IDE\VSIXInstaller.exe'
          $vsix = (Resolve-Path .\MauiDesigner.vsix).Path
          $log = Join-Path $PWD 'vsix-install.log'

          $process = Start-Process $vsixInstaller `
            -ArgumentList '/quiet', "/logFile:`"$log`"", "`"$vsix`"" `
            -Wait -PassThru

          # 1001 means "already installed", which is still a valid install.
          if ($process.ExitCode -notin @(0, 1001)) {
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 }
            throw "VSIXInstaller failed with exit code $($process.ExitCode)."
          }

          Write-Host "VSIXInstaller exit code: $($process.ExitCode)"

      - name: Check what landed on disk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # VSIXInstaller reports success even when it decides the extension does
          # not apply to this Visual Studio, so "it exited 0" proves nothing on
          # its own. Only finding the assembly on disk does.
          $configRoot = Get-Item "$env:LOCALAPPDATA\Microsoft\VisualStudio\*_$env:VS_INSTANCE" -ErrorAction SilentlyContinue |
                        Select-Object -First 1
          if (-not $configRoot) { throw "No configuration folder for Visual Studio instance $env:VS_INSTANCE." }

          "VS_CONFIG_ROOT=$($configRoot.FullName)" | Out-File $env:GITHUB_ENV -Append

          $deployed = Get-ChildItem (Join-Path $configRoot.FullName 'Extensions') -Recurse `
                        -Filter 'MauiDesigner.Vsix.dll' -ErrorAction SilentlyContinue |
                      Select-Object -First 1
          if (-not $deployed) {
            throw "VSIXInstaller reported success but deployed nothing under $($configRoot.FullName)\Extensions. " +
                  'This usually means the manifest does not target this Visual Studio version.'
          }

          $root = $deployed.Directory.FullName
          Write-Host "Deployed to $root"
          "EXTENSION_ROOT=$root" | Out-File $env:GITHUB_ENV -Append

          # The designer is useless without its web assets, and this is the first
          # point where we see what Visual Studio would actually load.
          foreach ($required in @('MauiDesigner.Core.dll', 'MauiDesigner.Vsix.pkgdef', 'webview\index.html')) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "The installed extension is missing $required."
            }
          }

          Write-Host 'Installed payload looks complete.'

      - name: Let Visual Studio ingest the registration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # This is Visual Studio itself parsing our pkgdef and merging it into
          # its configuration. A malformed registration fails or is dropped here.
          $devenv = Join-Path $env:VS_PATH 'Common7\IDE\devenv.exe'
          $process = Start-Process $devenv -ArgumentList '/updateconfiguration' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "devenv /updateconfiguration failed with exit code $($process.ExitCode)."
          }

          Write-Host 'Visual Studio updated its configuration successfully.'

      - name: Check Visual Studio registered the designer for .xaml
        # Windows PowerShell keeps the registry types in the framework, which
        # keeps the interop below to a few lines.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Visual Studio keeps its configuration in a private registry hive
          # rather than the system registry, so read it the way VS does. This is
          # the real proof that "Open With > MAUI Designer" would be offered:
          # anything less is only checking what we asked for, not what VS stored.
          $hive = Join-Path $env:VS_CONFIG_ROOT 'privateregistry.bin'
          if (-not (Test-Path $hive)) { throw "Could not find the private registry hive at $hive." }

          # RegLoadAppKey is the API Visual Studio itself uses. Unlike `reg load`
          # it needs no privileges and does not attach the hive to HKLM, so it
          # copes with the IDE's background processes still holding the file.
          Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using Microsoft.Win32;
          using Microsoft.Win32.SafeHandles;

          public static class VsHive
          {
              [DllImport("advapi32.dll", CharSet = CharSet.Unicode)]
              private static extern int RegLoadAppKey(string file, out IntPtr key, int access, int options, int reserved);

              public static RegistryKey Open(string file)
              {
                  IntPtr key;
                  int error = RegLoadAppKey(file, out key, 0x20019, 0, 0);
                  if (error != 0) { throw new Win32Exception(error); }
                  return RegistryKey.FromHandle(new SafeRegistryHandle(key, true));
              }
          }
          '@

          $root = $null
          foreach ($attempt in 1..5) {
            try { $root = [VsHive]::Open($hive); break }
            catch {
              if ($attempt -eq 5) { throw }
              Write-Host "Hive is still busy ($($_.Exception.Message)); retrying in 10s."
              # /updateconfiguration leaves service hosts running for a while.
              Get-Process -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^(devenv|PerfWatson2|ServiceHub|Microsoft\.ServiceHub|VBCSCompiler)' } |
                Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 10
            }
          }

          try {
            $instance = Split-Path $env:VS_CONFIG_ROOT -Leaf
            $config = $root.OpenSubKey("Software\Microsoft\VisualStudio\$instance")
            if (-not $config) { throw "No '$instance' configuration root inside the private hive." }

            $editor = $config.OpenSubKey("Editors\$env:EDITOR_FACTORY_GUID")
            if (-not $editor) {
              throw "Visual Studio did not register the editor factory $env:EDITOR_FACTORY_GUID."
            }

            $owningPackage = $editor.GetValue('Package')
            if ($owningPackage -ne $env:PACKAGE_GUID) {
              throw "The editor factory is owned by $owningPackage, expected $env:PACKAGE_GUID."
            }

            $extensions = $editor.OpenSubKey('Extensions')
            $priority = if ($extensions) { $extensions.GetValue('xaml') } else { $null }
            if ($null -eq $priority) {
              throw 'The editor factory is not registered for the .xaml extension.'
            }

            # Deliberately low so the built-in XAML editor stays the default and
            # double-clicking a file behaves exactly as it did before installing.
            if ($priority -ne 0x10) {
              throw "The .xaml priority is 0x$('{0:X}' -f $priority), expected 0x10."
            }

            $logicalViews = $editor.OpenSubKey('LogicalViews')
            if (-not $logicalViews -or $logicalViews.GetValueNames() -notcontains '{7651a702-06e5-11d1-8ebd-00a0c90f26ea}') {
              throw 'The designer logical view is not registered.'
            }

            $package = $config.OpenSubKey("Packages\$env:PACKAGE_GUID")
            if (-not $package) { throw "Visual Studio did not register package $env:PACKAGE_GUID." }

            Write-Host "Visual Studio registered package '$($package.GetValue(''))'"
            Write-Host "  editor factory : $env:EDITOR_FACTORY_GUID"
            Write-Host "  .xaml priority : 0x$('{0:X}' -f $priority)"
            Write-Host "  logical views  : $($logicalViews.GetValueNames() -join ', ')"
          }
          finally {
            $root.Dispose()
          }

      - name: Uninstall cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vsixInstaller = Join-Path $env:VS_PATH 'Common7\IDE\VSIXInstaller.exe'
          $process = Start-Process $vsixInstaller `
            -ArgumentList '/quiet', "/uninstall:$env:EXTENSION_IDENTITY" `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Uninstalling failed with exit code $($process.ExitCode)."
          }

          # Visual Studio either removes the folder outright or, if anything still
          # holds a handle, drops a .deleteme marker and removes it on next start.
          # Both mean the extension is gone; anything else means it is still live.
          $root = $env:EXTENSION_ROOT
          if ((Test-Path $root) -and -not (Test-Path "$root.deleteme")) {
            throw "The extension directory survived uninstall: $root"
          }

          Write-Host 'Uninstalled cleanly.'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vsix-install-log-${{ matrix.runner }}
          path: vsix-install.log
          if-no-files-found: ignore

  publish:
    name: Publish the pre-release
    # Only ship something that has been shown to install into a real IDE.
    needs: [package, install-check]
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MauiDesigner-vsix

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          notes=$(cat <<'NOTES'
          Beta build of the Visual Studio 2022 extension. Expect rough edges and breaking changes.

          **Install:** download `MauiDesigner.vsix`, close Visual Studio, double-click the file, then reopen. Right-click any `.xaml` page and choose **Open With… > MAUI Designer**.

          **Requires:** Windows with Visual Studio 2022 or 2026 (17.x or 18.x) and the WebView2 runtime.
          NOTES
          )

          publish() {
            local tag="$1" title="$2"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" MauiDesigner.vsix --clobber
            else
              gh release create "$tag" MauiDesigner.vsix \
                --prerelease --target "$GITHUB_SHA" \
                --title "$title" --notes "$notes"
            fi
          }

          publish "$TAG" "MAUI Designer for Visual Studio $TAG (beta)"

          # `releases/latest/download/...` skips pre-releases, so the website
          # would get a 404 from it. This rolling release gives the site a URL
          # that keeps working without a redeploy, while every build also stays
          # available under its own version tag.
          gh release delete vsix-latest --yes --cleanup-tag 2>/dev/null || true
          publish "vsix-latest" "Latest beta build ($TAG)"
